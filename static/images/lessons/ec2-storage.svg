<svg xmlns="http://www.w3.org/2000/svg"
      width="900" height="500" viewBox="0 0 900 500" role="img">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8"
          refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#60a5fa"/>
        </marker>
      </defs>
      <rect width="900" height="500" rx="18" fill="#0b1220"/>
      <text x="35" y="48" fill="#e5edf8" font-size="25"
        font-weight="700">EC2 storage explained</text>
      <text x="35" y="76" fill="#9aacc5" font-size="14">Choose the right storage for the job.</text>

    <rect x="45" y="150" width="220" height="100" rx="13"
          fill="#111c2e" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="45" y="150" width="5" height="100" rx="2" fill="#c4b5fd"/>
    <text x="63" y="181" fill="#e5edf8" font-size="17"
          font-weight="700">AMI</text>
    <text x="63" y="207" fill="#9aacc5" font-size="13">Image used to launch</text>

    <rect x="340" y="150" width="220" height="100" rx="13"
          fill="#111c2e" stroke="#fb923c" stroke-width="2"/>
    <rect x="340" y="150" width="5" height="100" rx="2" fill="#fb923c"/>
    <text x="358" y="181" fill="#e5edf8" font-size="17"
          font-weight="700">EC2 instance</text>
    <text x="358" y="207" fill="#9aacc5" font-size="13">CPU and memory</text>

    <rect x="635" y="150" width="220" height="100" rx="13"
          fill="#111c2e" stroke="#34d399" stroke-width="2"/>
    <rect x="635" y="150" width="5" height="100" rx="2" fill="#34d399"/>
    <text x="653" y="181" fill="#e5edf8" font-size="17"
          font-weight="700">EBS volume</text>
    <text x="653" y="207" fill="#9aacc5" font-size="13">Persistent block storage</text>

    <line x1="265" y1="200" x2="340" y2="200"
          stroke="#c4b5fd" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="302.5" y="191.0" text-anchor="middle" fill="#c4b5fd" font-size="12">Launch</text>

    <line x1="560" y1="200" x2="635" y2="200"
          stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="597.5" y="191.0" text-anchor="middle" fill="#34d399" font-size="12">Attach</text>

    <rect x="110" y="315" width="260" height="85" rx="13"
          fill="#111c2e" stroke="#60a5fa" stroke-width="2"/>
    <rect x="110" y="315" width="5" height="85" rx="2" fill="#60a5fa"/>
    <text x="128" y="346" fill="#e5edf8" font-size="17"
          font-weight="700">EBS snapshot</text>
    <text x="128" y="372" fill="#9aacc5" font-size="13">Point-in-time backup</text>

    <line x1="700" y1="250" x2="370" y2="350"
          stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="535.0" y="291.0" text-anchor="middle" fill="#60a5fa" font-size="12">Snapshot</text>

    <rect x="500" y="315" width="300" height="85" rx="13"
          fill="#111c2e" stroke="#fbbf24" stroke-width="2"/>
    <rect x="500" y="315" width="5" height="85" rx="2" fill="#fbbf24"/>
    <text x="518" y="346" fill="#e5edf8" font-size="17"
          font-weight="700">Amazon S3</text>
    <text x="518" y="372" fill="#9aacc5" font-size="13">Objects: files and backups</text>
    <text x="45" y="435" fill="#e5edf8" font-size="15">
EBS = block disk for a server. S3 = object storage accessed through APIs.
An AMI is a launch image, not a running server.
</text>
      <text x="35" y="472" fill="#9aacc5" font-size="12">
        CLOUDSIM LEARN AND PRACTICE  |  CONCEPTUAL AWS DIAGRAM
      </text>
    </svg>
