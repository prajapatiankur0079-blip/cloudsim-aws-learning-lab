<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600"
 viewBox="0 0 1100 600" role="img">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#0b1424"/>
   <stop offset="1" stop-color="#101f35"/>
  </linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3"
   orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#60a5fa"/></marker>
 </defs>
 <rect width="1100" height="600" rx="22" fill="url(#bg)"/>
 <rect x="30" y="28" width="7" height="62" rx="3" fill="#60a5fa"/>
 <text x="55" y="54" font-size="24" fill="#f8fafc" font-weight="700" text-anchor="start"><tspan x="55" dy="0">Amazon RDS | Troubleshooting</tspan></text>
 <text x="55" y="84" font-size="12" fill="#a9bbd2" font-weight="400" text-anchor="start"><tspan x="55" dy="0">A safe diagnostic path from symptom to verified fix</tspan></text>
 <line x1="35" y1="112" x2="1065" y2="112" stroke="#293b53"/>
<rect x="95" y="145" width="910" height="68" rx="13" fill="#111e31" stroke="#60a5fa" stroke-width="1.7"/>
<rect x="95" y="145" width="5" height="68" rx="2" fill="#60a5fa"/>
<circle cx="119" cy="170" r="12" fill="#60a5fa"/><text x="119" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#07111f">1</text>
<text x="140" y="175" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="start"><tspan x="140" dy="0">1 · Observe</tspan></text>
<text x="113" y="206" font-size="13" fill="#b8c8dc" font-weight="400" text-anchor="start"><tspan x="113" dy="0">Capture the exact error, time and affected resource.</tspan></text><path d="M550,213 L550,232" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95" y="236" width="910" height="68" rx="13" fill="#111e31" stroke="#60a5fa" stroke-width="1.7"/>
<rect x="95" y="236" width="5" height="68" rx="2" fill="#60a5fa"/>
<circle cx="119" cy="261" r="12" fill="#60a5fa"/><text x="119" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#07111f">2</text>
<text x="140" y="266" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="start"><tspan x="140" dy="0">2 · Inspect</tspan></text>
<text x="113" y="297" font-size="13" fill="#b8c8dc" font-weight="400" text-anchor="start"><tspan x="113" dy="0">Check endpoint, network access, credentials, database status and connection limits.</tspan></text><path d="M550,304 L550,323" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95" y="327" width="910" height="68" rx="13" fill="#111e31" stroke="#60a5fa" stroke-width="1.7"/>
<rect x="95" y="327" width="5" height="68" rx="2" fill="#60a5fa"/>
<circle cx="119" cy="352" r="12" fill="#60a5fa"/><text x="119" y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#07111f">3</text>
<text x="140" y="357" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="start"><tspan x="140" dy="0">3 · Correct</tspan></text>
<text x="113" y="388" font-size="13" fill="#b8c8dc" font-weight="400" text-anchor="start"><tspan x="113" dy="0">Change one likely cause; avoid broad permission changes.</tspan></text><path d="M550,395 L550,414" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95" y="418" width="910" height="68" rx="13" fill="#111e31" stroke="#60a5fa" stroke-width="1.7"/>
<rect x="95" y="418" width="5" height="68" rx="2" fill="#60a5fa"/>
<circle cx="119" cy="443" r="12" fill="#60a5fa"/><text x="119" y="448" text-anchor="middle" font-size="12" font-weight="700" fill="#07111f">4</text>
<text x="140" y="448" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="start"><tspan x="140" dy="0">4 · Verify</tspan></text>
<text x="113" y="479" font-size="13" fill="#b8c8dc" font-weight="400" text-anchor="start"><tspan x="113" dy="0">Repeat the operation and confirm logs or metrics are healthy.</tspan></text><line x1="35" y1="548" x2="1065" y2="548" stroke="#293b53"/><text x="38" y="575" font-size="11" fill="#8295ae" font-weight="400" text-anchor="start"><tspan x="38" dy="0">CLOUDSIM / CONCEPTUAL AWS LEARNING DIAGRAM</tspan></text><text x="1060" y="575" font-size="11" fill="#60a5fa" font-weight="700" text-anchor="end"><tspan x="1060" dy="0">RDS</tspan></text></svg>
