<svg xmlns="http://www.w3.org/2000/svg"
      width="900" height="500" viewBox="0 0 900 500" role="img">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8"
          refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#60a5fa"/>
        </marker>
      </defs>
      <rect width="900" height="500" rx="18" fill="#0b1220"/>
      <text x="35" y="48" fill="#e5edf8" font-size="25"
        font-weight="700">EC2 instance lifecycle</text>
      <text x="35" y="76" fill="#9aacc5" font-size="14">Understand the common instance states before changing one.</text>

    <rect x="35" y="145" width="155" height="85" rx="13"
          fill="#111c2e" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="35" y="145" width="5" height="85" rx="2" fill="#c4b5fd"/>
    <text x="53" y="176" fill="#e5edf8" font-size="17"
          font-weight="700">Launch</text>
    <text x="53" y="202" fill="#9aacc5" font-size="13">Create instance</text>

    <rect x="235" y="145" width="155" height="85" rx="13"
          fill="#111c2e" stroke="#60a5fa" stroke-width="2"/>
    <rect x="235" y="145" width="5" height="85" rx="2" fill="#60a5fa"/>
    <text x="253" y="176" fill="#e5edf8" font-size="17"
          font-weight="700">Pending</text>
    <text x="253" y="202" fill="#9aacc5" font-size="13">AWS prepares it</text>

    <rect x="435" y="145" width="155" height="85" rx="13"
          fill="#111c2e" stroke="#34d399" stroke-width="2"/>
    <rect x="435" y="145" width="5" height="85" rx="2" fill="#34d399"/>
    <text x="453" y="176" fill="#e5edf8" font-size="17"
          font-weight="700">Running</text>
    <text x="453" y="202" fill="#9aacc5" font-size="13">Compute is active</text>

    <rect x="635" y="145" width="210" height="85" rx="13"
          fill="#111c2e" stroke="#fbbf24" stroke-width="2"/>
    <rect x="635" y="145" width="5" height="85" rx="2" fill="#fbbf24"/>
    <text x="653" y="176" fill="#e5edf8" font-size="17"
          font-weight="700">Stopping</text>
    <text x="653" y="202" fill="#9aacc5" font-size="13">OS shutdown begins</text>

    <line x1="190" y1="187" x2="235" y2="187"
          stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>


    <line x1="390" y1="187" x2="435" y2="187"
          stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>


    <line x1="590" y1="187" x2="635" y2="187"
          stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>


    <rect x="635" y="300" width="210" height="80" rx="13"
          fill="#111c2e" stroke="#60a5fa" stroke-width="2"/>
    <rect x="635" y="300" width="5" height="80" rx="2" fill="#60a5fa"/>
    <text x="653" y="331" fill="#e5edf8" font-size="17"
          font-weight="700">Stopped</text>
    <text x="653" y="357" fill="#9aacc5" font-size="13">Can start again</text>

    <line x1="740" y1="230" x2="740" y2="300"
          stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow)"/>


    <rect x="335" y="300" width="210" height="80" rx="13"
          fill="#111c2e" stroke="#fb923c" stroke-width="2"/>
    <rect x="335" y="300" width="5" height="80" rx="2" fill="#fb923c"/>
    <text x="353" y="331" fill="#e5edf8" font-size="17"
          font-weight="700">Terminated</text>
    <text x="353" y="357" fill="#9aacc5" font-size="13">Cannot restart</text>

    <line x1="635" y1="340" x2="545" y2="340"
          stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="590.0" y="331.0" text-anchor="middle" fill="#fb923c" font-size="12">Terminate</text>

    <line x1="635" y1="320" x2="590" y2="220"
          stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="612.5" y="261.0" text-anchor="middle" fill="#60a5fa" font-size="12">Start again</text>
    <text x="40" y="420" fill="#fbbf24" font-size="15">
Stopping and stopping are different: stopping ends compute temporarily;
termination deletes the instance resource.
</text>
      <text x="35" y="472" fill="#9aacc5" font-size="12">
        CLOUDSIM LEARN AND PRACTICE  |  CONCEPTUAL AWS DIAGRAM
      </text>
    </svg>
