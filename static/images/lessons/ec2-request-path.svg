    <text x="443" y="222" fill="#9aacc5" font-size="13">Chooses a route</text>

    <rect x="640" y="165" width="220" height="90" rx="13"
          fill="#111c2e" stroke="#fbbf24" stroke-width="2"/>
    <rect x="640" y="165" width="5" height="90" rx="2" fill="#fbbf24"/>
    <text x="658" y="196" fill="#e5edf8" font-size="17"
          font-weight="700">Security Group</text>
    <text x="658" y="222" fill="#9aacc5" font-size="13">Allows permitted traffic</text>

    <line x1="185" y1="210" x2="225" y2="210"
          stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="205.0" y="201.0" text-anchor="middle" fill="#60a5fa" font-size="12">HTTPS</text>

    <line x1="385" y1="210" x2="425" y2="210"
          stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>


    <line x1="600" y1="210" x2="640" y2="210"
