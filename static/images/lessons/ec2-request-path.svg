    <rect x="320" y="315" width="270" height="85" rx="13"
          fill="#111c2e" stroke="#fb923c" stroke-width="2"/>
    <rect x="320" y="315" width="5" height="85" rx="2" fill="#fb923c"/>
    <text x="338" y="346" fill="#e5edf8" font-size="17"
          font-weight="700">EC2 instance</text>
    <text x="338" y="372" fill="#9aacc5" font-size="13">Application runs here</text>

    <line x1="750" y1="255" x2="590" y2="350"
          stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="670.0" y="293.5" text-anchor="middle" fill="#fb923c" font-size="12">Allowed request</text>

      <text x="35" y="472" fill="#9aacc5" font-size="12">
