    <rect x="35" y="165" width="5" height="90" rx="2" fill="#c4b5fd"/>
    <text x="53" y="196" fill="#e5edf8" font-size="17"
          font-weight="700">User</text>
    <text x="53" y="222" fill="#9aacc5" font-size="13">Browser request</text>

    <rect x="225" y="165" width="160" height="90" rx="13"
          fill="#111c2e" stroke="#60a5fa" stroke-width="2"/>
    <rect x="225" y="165" width="5" height="90" rx="2" fill="#60a5fa"/>
    <text x="243" y="196" fill="#e5edf8" font-size="17"
          font-weight="700">Internet GW</text>
    <text x="243" y="222" fill="#9aacc5" font-size="13">VPC entry/exit</text>

    <rect x="425" y="165" width="175" height="90" rx="13"
