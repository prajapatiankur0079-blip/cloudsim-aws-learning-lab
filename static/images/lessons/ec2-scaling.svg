<svg xmlns="http://www.w3.org/2000/svg"
      width="900" height="500" viewBox="0 0 900 500" role="img">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8"
          refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#60a5fa"/>
        </marker>
      </defs>
      <rect width="900" height="500" rx="18" fill="#0b1220"/>
      <text x="35" y="48" fill="#e5edf8" font-size="25"
        font-weight="700">EC2 scaling and monitoring</text>
      <text x="35" y="76" fill="#9aacc5" font-size="14">A conceptual pattern for a more resilient web application.</text>

    <rect x="55" y="135" width="210" height="80" rx="13"
          fill="#111c2e" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="55" y="135" width="5" height="80" rx="2" fill="#c4b5fd"/>
    <text x="73" y="166" fill="#e5edf8" font-size="17"
          font-weight="700">Users</text>
    <text x="73" y="192" fill="#9aacc5" font-size="13">Application traffic</text>

    <rect x="345" y="135" width="230" height="80" rx="13"
          fill="#111c2e" stroke="#60a5fa" stroke-width="2"/>
    <rect x="345" y="135" width="5" height="80" rx="2" fill="#60a5fa"/>
    <text x="363" y="166" fill="#e5edf8" font-size="17"
          font-weight="700">Load balancer</text>
    <text x="363" y="192" fill="#9aacc5" font-size="13">Distributes requests</text>

    <line x1="265" y1="175" x2="345" y2="175"
          stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="305.0" y="166.0" text-anchor="middle" fill="#60a5fa" font-size="12">HTTPS</text>
    <rect x="620" y="105" width="235" height="245" rx="16"
       fill="#10291f" stroke="#34d399" stroke-width="2"/>
    <text x="645" y="135" fill="#34d399" font-size="17"
       font-weight="700">Auto Scaling Group</text>
    <rect x="645" y="160" width="185" height="65" rx="13"
          fill="#111c2e" stroke="#fb923c" stroke-width="2"/>
    <rect x="645" y="160" width="5" height="65" rx="2" fill="#fb923c"/>
    <text x="663" y="191" fill="#e5edf8" font-size="17"
          font-weight="700">EC2 • AZ A</text>
    <text x="663" y="217" fill="#9aacc5" font-size="13">Application copy</text>

    <rect x="645" y="245" width="185" height="65" rx="13"
          fill="#111c2e" stroke="#fb923c" stroke-width="2"/>
    <rect x="645" y="245" width="5" height="65" rx="2" fill="#fb923c"/>
    <text x="663" y="276" fill="#e5edf8" font-size="17"
          font-weight="700">EC2 • AZ B</text>
    <text x="663" y="302" fill="#9aacc5" font-size="13">Application copy</text>

    <line x1="575" y1="175" x2="645" y2="192"
          stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)"/>


    <line x1="575" y1="185" x2="645" y2="278"
          stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)"/>


    <rect x="130" y="285" width="330" height="75" rx="13"
          fill="#111c2e" stroke="#fbbf24" stroke-width="2"/>
    <rect x="130" y="285" width="5" height="75" rx="2" fill="#fbbf24"/>
    <text x="148" y="316" fill="#e5edf8" font-size="17"
          font-weight="700">Amazon CloudWatch</text>
    <text x="148" y="342" fill="#9aacc5" font-size="13">Metrics, alarms and dashboards</text>

    <line x1="700" y1="310" x2="460" y2="325"
          stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="580.0" y="308.5" text-anchor="middle" fill="#fbbf24" font-size="12">Metrics</text>
    <text x="45" y="410" fill="#e5edf8" font-size="15">
A load balancer routes requests. Auto Scaling adjusts capacity.
CloudWatch helps detect problems; multi-AZ design improves resilience.
</text>
      <text x="35" y="472" fill="#9aacc5" font-size="12">
        CLOUDSIM LEARN AND PRACTICE  |  CONCEPTUAL AWS DIAGRAM
      </text>
    </svg>
