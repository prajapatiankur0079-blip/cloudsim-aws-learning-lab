<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65768b"/></marker></defs>
<rect width="1440" height="900" fill="#f5f8fc"/>
<rect x="28" y="25" width="1384" height="850" rx="22" fill="#ffffff" stroke="#d7e1ed" stroke-width="2"/>
<text x="65" y="76" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="750" fill="#152b49">Amazon Route 53 — Troubleshooting Guide</text>
<text x="65" y="110" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#60748b">Follow the diagnostic sequence before changing configuration</text>
<rect x="65" y="132" width="1310" height="2" fill="#e6edf5"/>
<image href="../../../aws-official/AmazonRoute53.svg" x="1280" y="48" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>
<text x="720" y="205" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="750" fill="#2463a6">CHECK IN THIS ORDER</text>
<text x="720" y="235" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450" fill="#60748b">Check record name and type, authoritative nameservers, TTL and target health.</text>
<rect x="65.0" y="300" width="222" height="155" rx="14" fill="#fff8e9" stroke="#d2a14a" stroke-width="1.8"/>
<circle cx="89.0" cy="325" r="13" fill="#d2a14a"/>
<text x="89.0" y="330" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="750" fill="#ffffff">1</text>
<text x="176.0" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" fill="#1c2d45">Start: identify symptom</text>
<path d="M290.0 377 H324.5" fill="none" stroke="#65768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="329.5" y="300" width="222" height="155" rx="14" fill="#fff8e9" stroke="#d2a14a" stroke-width="1.8"/>
<circle cx="353.5" cy="325" r="13" fill="#d2a14a"/>
<text x="353.5" y="330" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="750" fill="#ffffff">2</text>
<text x="440.5" y="368" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" fill="#1c2d45">Record name and record</text>
<text x="440.5" y="391" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#1c2d45">type</text>
<path d="M554.5 377 H589.0" fill="none" stroke="#65768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="594.0" y="300" width="222" height="155" rx="14" fill="#fff8e9" stroke="#d2a14a" stroke-width="1.8"/>
<circle cx="618.0" cy="325" r="13" fill="#d2a14a"/>
<text x="618.0" y="330" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="750" fill="#ffffff">3</text>
<text x="705.0" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" fill="#1c2d45">Hosted-zone nameservers</text>
<path d="M819.0 377 H853.5" fill="none" stroke="#65768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="858.5" y="300" width="222" height="155" rx="14" fill="#fff8e9" stroke="#d2a14a" stroke-width="1.8"/>
<circle cx="882.5" cy="325" r="13" fill="#d2a14a"/>
<text x="882.5" y="330" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="750" fill="#ffffff">4</text>
<text x="969.5" y="368" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" fill="#1c2d45">Alias target and routing</text>
<text x="969.5" y="391" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#1c2d45">policy</text>
<path d="M1083.5 377 H1118.0" fill="none" stroke="#65768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1123.0" y="300" width="222" height="155" rx="14" fill="#fff8e9" stroke="#d2a14a" stroke-width="1.8"/>
<circle cx="1147.0" cy="325" r="13" fill="#d2a14a"/>
<text x="1147.0" y="330" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="750" fill="#ffffff">5</text>
<text x="1234.0" y="368" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" fill="#1c2d45">TTL and health-check</text>
<text x="1234.0" y="391" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#1c2d45">status</text>
<text x="720" y="545" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="750" fill="#9b6a14">IF THE ISSUE REMAINS</text>
<rect x="100" y="570" width="1240" height="135" rx="12" fill="#fffaf0" stroke="#ecd7aa"/>
<text x="720" y="615" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#1c2d45">Reproduce the issue, inspect service logs / events, and verify the recent configuration change.</text>
<text x="720" y="650" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="450" fill="#78623d">Change one setting at a time and re-test before moving to the next step.</text>
<rect x="65" y="770" width="1310" height="1.5" fill="#e6edf5"/>
<text x="65" y="810" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" fill="#60748b">CLOUDSIM LEARN &amp; PRACTICE  /  ROUTE53  /  TROUBLESHOOTING</text>
<text x="1375" y="810" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="500" fill="#60748b">Educational reference</text>
</svg>